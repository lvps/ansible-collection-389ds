---
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Lint YAML
        run: yamllint galaxy.yml meta playbooks

      - name: Build collection
        run: ansible-galaxy collection build --force

      - name: Install collection
        run: |
          mkdir -p "$RUNNER_TEMP/collections"
          ansible-galaxy collection install lvps-ldap_389ds-*.tar.gz -p "$RUNNER_TEMP/collections"

      - name: Syntax-check collection
        env:
          ANSIBLE_COLLECTIONS_PATH: ${{ runner.temp }}/collections
        run: ansible-playbook --syntax-check playbooks/verify-package.yml

      - name: Upload collection artifact
        uses: actions/upload-artifact@v4
        with:
          name: lvps-ldap_389ds-collection
          path: lvps-ldap_389ds-*.tar.gz
          retention-days: 7
